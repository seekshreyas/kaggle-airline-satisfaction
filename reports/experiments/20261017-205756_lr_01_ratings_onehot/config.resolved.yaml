competition: playground-series-s6e10
data:
  dir: data/raw/playground-series-s6e10
  files:
    train: train.csv
    test: test.csv
    sample_submission: sample_submission.csv
  subset: dev
id_col: id
target: satisfaction
task: binary
metric: roc_auc
extra_metrics:
- log_loss
- accuracy
seed: 42
columns:
  style: snake_case
  overrides: {}
schema:
  continuous:
  - age
  - flight_distance
  - departure_delay_in_minutes
  - arrival_delay_in_minutes
  ordinal:
  - inflight_wifi_service
  - departure_arrival_time_convenient
  - ease_of_online_booking
  - gate_location
  - food_and_drink
  - online_boarding
  - seat_comfort
  - inflight_entertainment
  - on_board_service
  - leg_room_service
  - baggage_handling
  - checkin_service
  - cleanliness
  categorical:
  - gender
  - customer_type
  - type_of_travel
  - class
rating_groups:
  digital:
  - inflight_wifi_service
  - ease_of_online_booking
  - online_boarding
  comfort:
  - seat_comfort
  - inflight_entertainment
  - leg_room_service
  - cleanliness
  service:
  - on_board_service
  - checkin_service
  - baggage_handling
  - food_and_drink
  airport:
  - gate_location
  - departure_arrival_time_convenient
randomization:
  salt: s6e10-v1
  key: id
  stratify: true
splits:
  dev_frac: 0.25
  holdout_frac: 0.2
cv:
  n_splits: 4
keep_rule:
  min_gain: 0.0005
  must_beat_fold_std: true
paths:
  experiments_dir: reports/experiments
  submissions_dir: data/submissions
name: lr_01_ratings_onehot
description: Ratings one-hot encoded instead of linear
derive: {}
encode:
  continuous:
    cols: '@continuous'
    steps:
    - impute:
        strategy: median
    - scale:
        method: standard
  ratings:
    cols: '@ordinal'
    steps:
    - onehot:
        handle_unknown: ignore
  categorical:
    cols: '@categorical'
    steps:
    - onehot:
        drop: if_binary
        handle_unknown: ignore
remainder: drop
model:
  name: logreg
  params:
    C: 1.0
    l1_ratio: 0.0
    solver: lbfgs
    max_iter: 3000
lineage:
- competition
- lr_00_baseline
- lr_01_ratings_onehot
config_path: /Users/shreyas/Workspace/Workspace-Personal/Kaggle/Kaggle-Airline-Satisfaction/configs/experiments/lr_01_ratings_onehot.yaml
