# Phase 3: features fixed at the Phase 2 winner, tune the model.
# Phase 2 winner: lr_06 (rung 07 was reverted: +0.00032 < min_gain).
# Elastic net (saga) was dropped: one grid point took >10 min on the dev subset.
# L2 vs pure L1 answers the same question (does a sparser model help?) in minutes.
name: lr_08_regularization
description: Grid over C, L2 (lbfgs) vs L1 (liblinear)
label: "Tune model strength" # plain-language name used in reports
extends: lr_06_rating_aggregates.yaml

model:
  params: {max_iter: 3000}
  grid:                                     # list = union of products: 4 + 4 = 8 runs
    - {C: [0.01, 0.1, 1.0, 10.0], l1_ratio: [0.0], solver: [lbfgs]}      # L2
    - {C: [0.01, 0.1, 1.0, 10.0], l1_ratio: [1.0], solver: [liblinear]}  # L1
