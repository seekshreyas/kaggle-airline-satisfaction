# Phase 2 · rung 02: alternative to 01. Ratings stay linear; add N/A and >=4 flags.
name: lr_02_rating_flags
description: Linear ratings plus is0 / ge4 flags
extends: lr_00_baseline.yaml

derive:
  zero_flag: {cols: "@ordinal", exclude: [baggage_handling]}   # baggage has no zeros
  ge_flag: {cols: "@ordinal", threshold: 4}

encode:
  flags:
    cols: "@derived_flags"                  # every column a derive block tags as a flag
    steps: [passthrough]
