# Declarative test cases for src/submission.py

sample_submission:
    id: [10, 11, 12]
    satisfaction: [0.5, 0.5, 0.5]

make_submission:
    - id: reorders_to_sample_order
      ids: [12, 10, 11]
      preds: [0.2, 0.9, 0.4]
      expected: [0.9, 0.4, 0.2] # values for ids 10, 11, 12

    - id: missing_id_raises
      ids: [10, 11]
      preds: [0.2, 0.9]
      raises: { error: ValueError, match: have no prediction }

    - id: duplicate_id_raises
      ids: [10, 10, 11, 12]
      preds: [0.1, 0.2, 0.3, 0.4]
      raises: { error: ValueError, match: Duplicate ids }

validate:
    - id: valid
      submission: { id: [10, 11, 12], satisfaction: [0.1, 0.5, 0.99] }
      errors: []

    - id: wrong_row_count
      submission: { id: [10, 11], satisfaction: [0.1, 0.5] }
      errors: [rows != expected]

    - id: ids_out_of_order
      submission: { id: [11, 10, 12], satisfaction: [0.1, 0.5, 0.9] }
      errors: [ids differ]

    - id: missing_value
      submission: { id: [10, 11, 12], satisfaction: [0.1, null, 0.9] }
      errors: [missing or non-numeric]

    - id: out_of_range
      submission: { id: [10, 11, 12], satisfaction: [0.1, 1.5, -0.2] }
      errors: ["outside [0, 1]"]

    - id: wrong_columns
      submission: { id: [10, 11, 12], prob: [0.1, 0.5, 0.9] }
      errors: [columns]
