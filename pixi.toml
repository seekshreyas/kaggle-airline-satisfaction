[workspace]
authors = ["Shreyas <847781+seekshreyas@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "Kaggle-Airline-Satisfaction"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
sync-agents = "python scripts/sync_agent_config.py"

[dependencies]
python = ">=3.14,<3.15"
jupyterlab = ">=4.6.4,<5"
scipy = ">=1.18.1,<2"
numpy = ">=2.5.3,<3"
pandas = ">=3.0.6,<4"
duckdb = ">=1.5.6,<2"
kaggle = ">=2.2.4,<3"
mcp = ">=2.3.0,<3"
kagglehub = ">=1.0.2,<2"
yellowbrick = ">=1.5,<2"
plotly = ">=7.1.0,<8"
seaborn = ">=0.13.2,<0.14"
scikit-learn = ">=1.9.1,<2"
lime = ">=0.2.0.1,<0.3"
pymc = ">=6.3.1,<7"
nutpie = ">=0.16.11,<0.17"
numba = ">=0.67.0,<0.68"
arviz = ">=1.3.0,<2"
anywidget = ">=0.11.0,<0.12"
python-kaleido = ">=1.5.0,<2"
pydantic = ">=2.14.0,<3"
pydantic-ai = ">=2.55.0,<3"
pydantic-ai-harness = ">=0.31.0,<0.32"
pip = ">=26.2.1,<27"
anthropic = ">=1.13.0,<2"

[pypi-dependencies]
marimo = { version = ">=0.25.1, <0.26", extras = ["recommended"] }
